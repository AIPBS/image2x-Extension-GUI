name: Test

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/**'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtmultimedia5-dev \
            qttools5-dev-tools \
            libgl1-mesa-dev \
            libx11-dev \
            pkg-config \
            apngasm \
            apngdis \
            apngopt

      - name: Build application
        working-directory: src/image2x-ui
        run: |
          qmake
          make -j"$(nproc)"
          for ts in translations/language_*.ts; do
            lrelease "$ts" -qm "${ts%.ts}.qm"
          done

      - name: Build logic tests
        working-directory: src/tests
        run: |
          mkdir -p "$RUNNER_TEMP/image2x-logic-tests"
          cd "$RUNNER_TEMP/image2x-logic-tests"
          qmake "$GITHUB_WORKSPACE/src/tests/image2x_logic_tests.pro"
          make -j"$(nproc)"

      - name: Build model tests
        working-directory: src/tests
        run: |
          mkdir -p "$RUNNER_TEMP/image2x-model-tests"
          cd "$RUNNER_TEMP/image2x-model-tests"
          qmake "$GITHUB_WORKSPACE/src/tests/image2x_model_tests.pro"
          make -j"$(nproc)"

      - name: Run logic and UI-policy tests
        run: |
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/image2x-logic-tests/image2x-logic-tests"

      - name: Verify application launches offscreen
        working-directory: src/image2x-ui
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 ./image2x-Extension-GUI >/tmp/image2x-app.log 2>&1
          code=$?
          if [[ "$code" == 124 ]]; then
            exit 0
          fi
          cat /tmp/image2x-app.log
          exit 1

      - name: Upload tested binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image2x-tested-binaries"
          cp src/image2x-ui/image2x-Extension-GUI "$RUNNER_TEMP/image2x-tested-binaries/"
          cp src/image2x-ui/language_*.qm "$RUNNER_TEMP/image2x-tested-binaries/"
          cp "$RUNNER_TEMP/image2x-model-tests/image2x-model-tests" "$RUNNER_TEMP/image2x-tested-binaries/"

      - name: Upload tested binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: image2x-tested-binaries
          path: ${{ runner.temp }}/image2x-tested-binaries/
