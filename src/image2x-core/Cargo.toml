[package]
name = "image2x-core"
version = "1.0.0-dev"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Linux image2x business core and IPC backend"

[[bin]]
name = "image2x-core"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
