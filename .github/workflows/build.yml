name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with the built bundle"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt5 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtmultimedia5-dev \
            libgl1-mesa-dev \
            libx11-dev \
            pkg-config \
            patchelf

      - name: Build
        working-directory: src_code/Waifu2x-Extension-QT
        run: |
          qmake
          make -j"$(nproc)"

      - name: Bundle Qt libraries into lib/
        working-directory: src_code/Waifu2x-Extension-QT
        run: |
          set -euo pipefail
          mkdir -p bundle/lib
          cp Waifu2x-Extension-GUI bundle/

          # Resolve ALL dynamic dependencies transitively and copy into bundle/lib
          # (first pass: the binary; then keep resolving deps of newly added libs)
          EXCLUDE='^(libc\.so\.6|libm\.so\.6|libpthread\.so\.0|libdl\.so\.2|libresolv\.so\.2|libnsl\.so\.1|libstdc\+\+\.so\.6|libgcc_s\.so\.1|libcap\.so\.2|libcom_err\.so\.2|libmd4c\.so\.0|libmd\.so\.0|libmp3lame\.so\.0|libmpg123\.so\.0|linux-vdso\.so\.1|ld-linux.*\.so\.2)$'
          copy_libs() {
            local target="$1"
            ldd "$target" 2>/dev/null | awk '/=> \//{print $3}' | sort -u
          }
          LIBS="$(copy_libs Waifu2x-Extension-GUI)"
          # Also resolve deps of Qt platform plugins
          for p in plugins/platforms/*.so plugins/imageformats/*.so; do
            [ -f "$p" ] && LIBS="$LIBS $(copy_libs "$p")"
          done
          for lib in $(echo "$LIBS" | sort -u); do
            name=$(basename "$lib")
            echo "$name" | grep -qE "$EXCLUDE" && continue
            cp -L "$lib" bundle/lib/ 2>/dev/null || true
          done
          # Qt platform integration libs (libQt5XcbQpa etc.) — grab any Qt5Xcb/Qt5Wayland/Qt5DBus
          for extra in /usr/lib/x86_64-linux-gnu/libQt5*XcbQpa.so* /usr/lib/x86_64-linux-gnu/libQt5*Wayland*.so* /usr/lib/x86_64-linux-gnu/libQt5DBus.so*; do
            [ -f "$extra" ] && cp -L "$extra" bundle/lib/ 2>/dev/null || true
          done
          # And their transitive deps
          for extra in bundle/lib/libQt5*XcbQpa.so* bundle/lib/libQt5*Wayland*.so*; do
            [ -f "$extra" ] && for lib in $(copy_libs "$extra"); do
              name=$(basename "$lib")
              echo "$name" | grep -qE "$EXCLUDE" && continue
              cp -L "$lib" bundle/lib/ 2>/dev/null || true
            done
          done

          # Qt plugins (platforms, imageformats, etc.)
          QT_PLUGINS=$(pkg-config --variable=plugindir Qt5Widgets 2>/dev/null || \
                        find /usr/lib/x86_64-linux-gnu/qt5/plugins -maxdepth 1 -type d | sed 's|.*/||')
          mkdir -p bundle/plugins
          for d in platforms imageformats multimedia; do
            if [ -d "/usr/lib/x86_64-linux-gnu/qt5/plugins/$d" ]; then
              cp -r "/usr/lib/x86_64-linux-gnu/qt5/plugins/$d" bundle/plugins/
            fi
          done

          # qt.conf tells Qt where its libs and plugins are (relative to binary)
          printf '%s\n' \
            '[Paths]' \
            'Prefix = .' \
            'Libraries = lib' \
            'Plugins = plugins' > bundle/qt.conf

          # Make the binary and plugins self-contained via RPATH=$ORIGIN
          # so ./Waifu2x-Extension-GUI works WITHOUT the wrapper script
          patchelf --set-rpath '$ORIGIN/lib' bundle/Waifu2x-Extension-GUI
          for p in bundle/plugins/platforms/*.so bundle/plugins/imageformats/*.so; do
            patchelf --set-rpath '$ORIGIN/../../lib' "$p" 2>/dev/null || true
          done
          # Also fix Qt platform integration libs' plugin dir so Qt finds them
          for p in bundle/plugins/platforms/*.so; do
            [ -f "$p" ] && patchelf --set-rpath '$ORIGIN/../../lib' "$p" 2>/dev/null || true
          done

      - name: Package bundle as tar.gz
        working-directory: src_code/Waifu2x-Extension-QT
        run: |
          tar czf Waifu2x-Extension-GUI-linux.tar.gz -C bundle .
          ls -lh Waifu2x-Extension-GUI-linux.tar.gz

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waifu2x-Extension-GUI-linux
          path: src_code/Waifu2x-Extension-QT/Waifu2x-Extension-GUI-linux.tar.gz

      - name: Smoke test (offscreen launch, no env vars)
        working-directory: src_code/Waifu2x-Extension-QT
        run: |
          set +e
          # No LD_LIBRARY_PATH / no plugin path — tests the RPATH self-containment
          QT_QPA_PLATFORM=offscreen timeout 8 ./bundle/Waifu2x-Extension-GUI >/tmp/app.log 2>&1
          CODE=$?
          if [ "$CODE" = "124" ]; then
            echo "PASS: app launched and stayed running until timeout (expected for GUI app)"
            exit 0
          fi
          echo "FAIL: app exited early with code $CODE"
          cat /tmp/app.log
          exit 1

  release-linux:
    needs: build-linux
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: Waifu2x-Extension-GUI-linux
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
        run: |
          set -euo pipefail
          ls -lh dist/
          # Re-publishing the same tag? Remove the old release so the asset is replaced.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" dist/Waifu2x-Extension-GUI-linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Waifu2x-Extension-GUI $TAG" \
            --notes "Linux bundle (Qt5). Models NOT included — download via src_code/scripts/download_models.sh"
