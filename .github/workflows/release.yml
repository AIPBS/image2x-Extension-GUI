name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  gate:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      tag: ${{ steps.check.outputs.tag }}
      create_tag: ${{ steps.check.outputs.create_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check release changelog and GitHub Release state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          top="$(awk '/^##[[:space:]]/ { print; exit }' CHANGELOG.md)"

          if [[ "$top" =~ ^##[[:space:]]+\[Unreleased\] ]]; then
            echo 'Top changelog section is Unreleased; running CI only.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$top" =~ ^##[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$) ]]; then
            echo "Top changelog section is not a version: $top" >&2
            exit 1
          fi
          tag="${BASH_REMATCH[1]}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; running CI only."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tag_commit="$(git rev-list -n 1 "$tag^{commit}")"
            [[ "$tag_commit" == "$GITHUB_SHA" ]] || {
              echo "Existing tag $tag does not point to $GITHUB_SHA." >&2
              exit 1
            }
            create_tag=false
          else
            create_tag=true
          fi

          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: [test, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release tag
        if: needs.gate.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

  package:
    needs: [test, gate, prepare-release]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GPU_HELPER_REPOSITORY: AIPEACM/gpu-driver-helper
      GH_TOKEN: ${{ secrets.GPU_HELPER_TOKEN || github.token }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.tag }}

      - name: Install packaging and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtmultimedia5-dev \
            qttools5-dev-tools \
            libgl1-mesa-dev \
            libx11-dev \
            pkg-config \
            patchelf \
            apngasm \
            apngdis \
            apngopt \
            curl \
            unzip \
            tar \
            imagemagick \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools

      - name: Download tested binaries
        uses: actions/download-artifact@v8
        with:
          name: image2x-tested-binaries
          path: tested/

      - name: Restore executable permissions
        run: chmod +x tested/image2x-Extension-GUI tested/image2x-model-tests

      - name: Resolve latest GPU helper release
        id: gpu-helper-release
        run: |
          tag="$(gh release view --repo "$GPU_HELPER_REPOSITORY" --json tagName --jq .tagName)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache GPU helper
        id: gpu-helper-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gpu-driver-helper
          key: gpu-driver-helper-${{ steps.gpu-helper-release.outputs.tag }}

      - name: Download GPU helper on cache miss
        if: steps.gpu-helper-cache.outputs.cache-hit != 'true'
        env:
          GPU_HELPER_TAG: ${{ steps.gpu-helper-release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/gpu-driver-helper"
          gh release download "$GPU_HELPER_TAG" \
            --repo "$GPU_HELPER_REPOSITORY" \
            --pattern gpu-driver-helper-linux-x86_64 \
            --dir "$RUNNER_TEMP/gpu-driver-helper" \
            --clobber

      - name: Create self-contained bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/lib bundle/plugins bundle/tools
          cp tested/image2x-Extension-GUI bundle/
          cp tested/language_*.qm bundle/
          cp "$RUNNER_TEMP/gpu-driver-helper/gpu-driver-helper-linux-x86_64" bundle/tools/gpu-driver-helper
          chmod 755 bundle/image2x-Extension-GUI
          chmod 755 bundle/tools/gpu-driver-helper

          copy_libs() {
            ldd "$1" 2>/dev/null | awk '/=> \//{print $3}' | sort -u
          }
          exclude='^(libc\.so\.6|libm\.so\.6|libpthread\.so\.0|libdl\.so\.2|libresolv\.so\.2|libnsl\.so\.1|libstdc\+\+\.so\.6|libgcc_s\.so\.1|linux-vdso\.so\.1|ld-linux.*\.so\.2)$'

          libraries="$(copy_libs bundle/image2x-Extension-GUI)"
          for library in $libraries; do
            name="$(basename "$library")"
            [[ "$name" =~ $exclude ]] && continue
            cp -L "$library" bundle/lib/
          done
          for plugin_dir in /usr/lib/x86_64-linux-gnu/qt5/plugins/*/; do
            [[ -d "$plugin_dir" ]] && cp -r "$plugin_dir" bundle/plugins/
          done
          for plugin in bundle/plugins/*/*.so*; do
            [[ -f "$plugin" ]] || continue
            for library in $(copy_libs "$plugin"); do
              name="$(basename "$library")"
              [[ "$name" =~ $exclude ]] && continue
              cp -L "$library" bundle/lib/ 2>/dev/null || true
            done
          done

          printf '%s\n' '[Paths]' 'Prefix = .' 'Libraries = lib' 'Plugins = plugins' > bundle/qt.conf
          patchelf --set-rpath '$ORIGIN' bundle/lib/*.so* 2>/dev/null || true
          patchelf --set-rpath '$ORIGIN/lib' bundle/image2x-Extension-GUI
          for plugin in bundle/plugins/*/*.so*; do
            [[ -f "$plugin" ]] && patchelf --set-rpath '$ORIGIN/../../lib' "$plugin" 2>/dev/null || true
          done

      - name: Cache public runtime archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/image2x-runtime-cache
          key: image2x-runtime-${{ hashFiles('src/scripts/install_linux_runtime.sh') }}

      - name: Install public engines and models
        env:
          MODEL_CACHE_DIRECTORY: ${{ runner.temp }}/image2x-runtime-cache/models
          RUNTIME_CACHE_DIRECTORY: ${{ runner.temp }}/image2x-runtime-cache/runtimes
        run: |
           bash src/scripts/install_linux_runtime.sh "$GITHUB_WORKSPACE/bundle"

      - name: Create runtime manifest
        run: |
          (
            cd bundle
            find dependencies/engines -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > bundle/runtime-manifest.sha256

      - name: Run packaged CPU model matrix
        run: |
          set -euo pipefail
          convert -size 32x32 xc:white /tmp/image2x-model-input.png
          software_icd=''
          for candidate in /usr/share/vulkan/icd.d/*lvp*.json; do
            if [[ -f "$candidate" ]]; then
              software_icd="$candidate"
              break
            fi
          done
          [[ -n "$software_icd" ]] || { echo 'No software Vulkan ICD found.' >&2; exit 1; }
          export IMAGE2X_SOFTWARE_VULKAN_ICD="$software_icd"
          ./tested/image2x-model-tests \
            --application-directory "$GITHUB_WORKSPACE/bundle" \
            --input /tmp/image2x-model-input.png \
            --cpu \
            --json "$GITHUB_WORKSPACE/model-test-results.json"

      - name: Upload release bundle and test evidence
        uses: actions/upload-artifact@v7
        with:
          name: image2x-linux-release-bundle
          path: |
            bundle/
            model-test-results.json

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          version=''
          version="$(awk -F '"' '/QString VERSION/{print $2; exit}' src/image2x-ui/app/mainwindow.h)"
          [[ "$version" == "${RELEASE_TAG}" ]] || {
            echo "Tag ${RELEASE_TAG} does not match application version ${version}." >&2
            exit 1
          }
          tar -czf image2x-Extension-GUI-linux.tar.gz -C bundle .
          gh release create "$RELEASE_TAG" image2x-Extension-GUI-linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "image2x-Extension-GUI $RELEASE_TAG" \
            --generate-notes
