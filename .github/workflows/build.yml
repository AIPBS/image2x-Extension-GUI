name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with the built bundle"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt5 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtmultimedia5-dev \
            libgl1-mesa-dev \
            libx11-dev \
            pkg-config

      - name: Build
        working-directory: src_code/Waifu2x-Extension-QT
        run: |
          qmake
          make -j"$(nproc)"

      - name: Bundle Qt libraries into lib/
        working-directory: src_code/Waifu2x-Extension-QT
        run: |
          set -euo pipefail
          mkdir -p bundle/lib
          cp Waifu2x-Extension-GUI bundle/

          # Resolve all dynamic dependencies and copy them into bundle/lib
          # EXCLUDE glibc core libs — bundling them breaks the app on other distros
          LIBS=$(ldd Waifu2x-Extension-GUI | awk '/=> \//{print $3} /\/lib/{print $1}' | sort -u)
          for lib in $LIBS; do
            name=$(basename "$lib")
            case "$name" in
              libc.so.6|libm.so.6|libpthread.so.0|libdl.so.2|libresolv.so.2|libnsl.so.1)
                continue ;;
              libstdc++.so.6|libgcc_s.so.1)
                continue ;;
              linux-vdso.so.1|ld-linux*.so.2)
                continue ;;
              *.so*)
                cp -L "$lib" bundle/lib/ 2>/dev/null || true ;;
            esac
          done

          # Qt plugins (platforms, imageformats, etc.)
          QT_PLUGINS=$(pkg-config --variable=plugindir Qt5Widgets 2>/dev/null || \
                        find /usr/lib/x86_64-linux-gnu/qt5/plugins -maxdepth 1 -type d | sed 's|.*/||')
          mkdir -p bundle/plugins
          for d in platforms imageformats multimedia; do
            if [ -d "/usr/lib/x86_64-linux-gnu/qt5/plugins/$d" ]; then
              cp -r "/usr/lib/x86_64-linux-gnu/qt5/plugins/$d" bundle/plugins/
            fi
          done

          # Launcher script that sets LD_LIBRARY_PATH + plugin path
          printf '%s\n' \
            '#!/bin/bash' \
            'DIR="$(cd "$(dirname "$0")" && pwd)"' \
            'export LD_LIBRARY_PATH="$DIR/lib:${LD_LIBRARY_PATH:-}"' \
            'export QT_QPA_PLATFORM_PLUGIN_PATH="$DIR/plugins"' \
            'exec "$DIR/Waifu2x-Extension-GUI" "$@"' > bundle/launch.sh
          chmod +x bundle/launch.sh

      - name: Package bundle as tar.gz
        working-directory: src_code/Waifu2x-Extension-QT
        run: |
          tar czf Waifu2x-Extension-GUI-linux.tar.gz -C bundle .
          ls -lh Waifu2x-Extension-GUI-linux.tar.gz

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waifu2x-Extension-GUI-linux
          path: src_code/Waifu2x-Extension-QT/Waifu2x-Extension-GUI-linux.tar.gz

      - name: Smoke test (offscreen launch)
        working-directory: src_code/Waifu2x-Extension-QT
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 ./bundle/launch.sh >/tmp/app.log 2>&1
          CODE=$?
          if [ "$CODE" = "124" ]; then
            echo "PASS: app launched and stayed running until timeout (expected for GUI app)"
            exit 0
          fi
          echo "FAIL: app exited early with code $CODE"
          cat /tmp/app.log
          exit 1

  release-linux:
    needs: build-linux
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: Waifu2x-Extension-GUI-linux
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
        run: |
          set -euo pipefail
          ls -lh dist/
          # Re-publishing the same tag? Remove the old release so the asset is replaced.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" dist/Waifu2x-Extension-GUI-linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Waifu2x-Extension-GUI $TAG" \
            --notes "Linux bundle (Qt5). Models NOT included — download via src_code/scripts/download_models.sh"
